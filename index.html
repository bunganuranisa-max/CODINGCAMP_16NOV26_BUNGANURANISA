<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hiasan Gelembung Melayang di Latar Belakang -->
  <div class="bg-decorations">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="container">
    <!-- Top Bar: Theme Toggle -->
    <div class="top-controls">
      <button id="theme-toggle" class="btn-secondary" title="Toggle Light/Dark Mode">
        🌙 Dark Mode
      </button>
    </div>

    <!-- Header / Greeting Card -->
    <header class="card greeting-card">
      <div class="sparkles">✨ 🌸 ✨</div>
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Loading date...</div>
      <div class="greeting-wrapper">
        <h1 id="greeting-text">Good Morning</h1>
        <button id="edit-name-btn" class="icon-btn" title="Set Your Name">✏️</button>
      </div>
      <div id="name-input-container" class="name-input-container hidden">
        <input type="text" id="user-name-input" placeholder="Enter your name..." maxlength="25" />
        <button id="save-name-btn" class="btn-primary">Save</button>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="dashboard-grid">
      <!-- Focus Timer Card -->
      <section class="card timer-card">
        <h2>⏱️ Focus Timer</h2>
        <div class="timer-ring">
          <div id="timer-display" class="timer-display">25:00</div>
        </div>
        <div class="timer-controls">
          <button id="start-timer" class="btn-primary">▶ Start</button>
          <button id="stop-timer" class="btn-secondary">⏸ Stop</button>
          <button id="reset-timer" class="btn-secondary">↺ Reset</button>
        </div>
        <!-- Custom Pomodoro Duration -->
        <div class="timer-custom">
          <label for="custom-minutes">Set minutes:</label>
          <input type="number" id="custom-minutes" min="1" max="120" value="25" />
          <button id="set-timer-btn" class="btn-secondary btn-sm">Set</button>
        </div>
      </section>

      <!-- To-Do List Card -->
      <section class="card tasks-card">
        <div class="tasks-header">
          <h2>📝 Tasks</h2>
          <select id="sort-tasks" class="sort-select" title="Sort Tasks">
            <option value="newest">Sort: Newest</option>
            <option value="oldest">Sort: Oldest</option>
            <option value="az">Sort: A - Z</option>
            <option value="status">Sort: Incomplete First</option>
          </select>
        </div>

        <form id="task-form" class="input-group">
          <input type="text" id="task-input" placeholder="Add a new task..." required />
          <button type="submit" class="btn-primary">+ Add</button>
        </form>
        <p id="task-error" class="error-msg hidden">Task already exists!</p>

        <ul id="task-list" class="task-list"></ul>
      </section>

      <!-- Quick Links Card -->
      <section class="card links-card">
        <h2>🔗 Quick Links</h2>
        <form id="link-form" class="link-input-group">
          <input type="text" id="link-name" placeholder="Link name" required />
          <input type="text" id="link-url" placeholder="URL (e.g. google.com)" required />
          <button type="submit" class="btn-primary">+ Add Link</button>
        </form>
        <div id="links-container" class="links-container"></div>
      </section>
    </main>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
